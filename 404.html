<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | MiGOVT.org</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Shared site-wide styles (banner, header, nav) -->
<link rel="stylesheet" href="/shared.css">

<style>
  /* ---------- Page-specific styles: 404 hero + footer ---------- */

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 24px 40px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  main::before {
    content: "";
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(76,124,146,0.16) 0%, rgba(76,124,146,0) 62%);
    pointer-events: none;
  }

  .stage-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 640px;
  }

  .map-wrap {
    position: relative;
    width: min(88vw, 420px);
    margin-bottom: 10px;
  }

  .map-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .map-card {
    fill: var(--paper-warm);
    stroke: var(--lake-deep);
    stroke-width: 3;
  }

  .contour {
    fill: none;
    stroke: var(--lake-mist);
    stroke-width: 1.4;
    opacity: 0.55;
  }

  .compass-ring {
    fill: none;
    stroke: var(--lake-deep);
    stroke-width: 1.4;
    opacity: 0.6;
  }

  .compass-tick {
    stroke: var(--lake-deep);
    stroke-width: 1.4;
    opacity: 0.6;
  }

  .compass-letter {
    font-family: 'Public Sans', sans-serif;
    font-size: 8px;
    font-weight: 700;
    fill: var(--lake-deep);
    opacity: 0.65;
  }

  .start-dot {
    fill: var(--lake-deep);
  }

  .trail-line {
    fill: none;
    stroke: var(--trail-amber);
    stroke-width: 2;
    stroke-dasharray: 5 6;
    stroke-linecap: round;
  }

  .lost-pin-group {
    transform-origin: center;
  }

  .lost-pin {
    fill: var(--trail-amber);
    stroke: var(--sign-brown-dark);
    stroke-width: 1.5;
  }

  .lost-pin-dot {
    fill: var(--sign-brown-dark);
  }

  .you-are-nowhere {
    font-family: 'Public Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    fill: var(--sign-brown-dark);
  }

  @media (prefers-reduced-motion: no-preference) {
    .lost-pin-group {
      animation: bob 2.6s ease-in-out infinite;
    }
    .trail-line {
      animation: dash 1.8s linear infinite;
    }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes dash {
    to { stroke-dashoffset: -22; }
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(26px, 5vw, 40px);
    line-height: 1.18;
    margin: 18px 0 14px;
    color: var(--lake-deep);
  }

  .eyebrow-404 {
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--trail-amber-text);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  p.lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 0 36px;
  }

  .cta-button {
    display: inline-block;
    background: var(--lake-deep);
    color: var(--paper);
    text-decoration: none;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 14px 30px;
    border-radius: 4px;
    border-bottom: 3px solid var(--trail-amber);
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .cta-button:hover {
    background: var(--lake-night);
    transform: translateY(-1px);
  }

  footer {
    text-align: center;
    padding: 22px 20px 26px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid rgba(90,70,50,0.15);
  }

  footer strong {
    color: var(--ink);
  }

  @media (max-width: 480px) {
    .lede { font-size: 15px; }
  }
</style>
</head>
<body>

  <!-- Shared banner + header + mobile nav get injected here by partials.js -->
  <div id="site-chrome"></div>

  <main>
    <div class="stage-inner">

      <div class="map-wrap">
        <svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a map with a dashed trail leading off the edge to a lost location marker">
          <rect class="map-card" x="10" y="10" width="380" height="260" rx="14" />

          <path class="contour" d="M30,60 C90,40 150,80 210,55 C270,32 320,55 370,45" />
          <path class="contour" d="M25,120 C100,105 160,140 230,118 C300,98 340,120 375,110" />
          <path class="contour" d="M35,190 C110,170 170,205 240,185 C300,168 335,190 365,178" />
          <path class="contour" d="M45,235 C110,222 180,245 250,228" />

          <g transform="translate(52,52)">
            <circle class="compass-ring" r="20" />
            <line class="compass-tick" x1="0" y1="-20" x2="0" y2="-26" />
            <line class="compass-tick" x1="0" y1="20" x2="0" y2="26" />
            <line class="compass-tick" x1="-20" y1="0" x2="-26" y2="0" />
            <line class="compass-tick" x1="20" y1="0" x2="26" y2="0" />
            <text class="compass-letter" x="0" y="-30" text-anchor="middle">N</text>
          </g>

          <circle class="start-dot" cx="150" cy="180" r="5" />

          <path class="trail-line" d="M154,174 C 220,140 300,90 388,40" />

          <g class="lost-pin-group">
            <path class="lost-pin" d="M388,10
              c -16,0 -28,12 -28,28
              c 0,20 28,46 28,46
              s 28,-26 28,-46
              c 0,-16 -12,-28 -28,-28 Z" />
            <circle class="lost-pin-dot" cx="388" cy="38" r="9" />
            <text class="you-are-nowhere" x="388" y="-2" text-anchor="middle">YOU ARE ??</text>
          </g>
        </svg>
      </div>

      <div class="eyebrow-404">Error 404</div>
      <h1>Looks like you've wandered&nbsp;off&nbsp;the&nbsp;trail.</h1>
      <p class="lede">
        The page you're looking for isn't here. It may have moved, been
        renamed, or the link might just be wrong. Let's get you back on
        the map.
      </p>

      <a class="cta-button" href="/">Return to homepage</a>

    </div>
  </main>

  <footer>
    <strong>Department of Technology</strong> · migovt.org · Error 404
  </footer>

  <!-- Injects banner + header + mobile nav into #site-chrome above -->
  <script src="/partials.js"></script>

</body>
</html>
