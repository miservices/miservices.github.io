<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | MiGOVT.org</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Shared site-wide styles (banner, header, nav, confirm modal) -->
<link rel="stylesheet" href="/shared.css">

<style>
  /* ---------- Page-specific styles ---------- */

  .page-hero {
    background: linear-gradient(180deg, var(--paper-warm) 0%, var(--paper) 100%);
    border-bottom: 1px solid var(--nav-border);
    padding: 52px 24px 40px;
    text-align: center;
  }

  .page-hero-inner { max-width: 620px; margin: 0 auto; }

  .eyebrow {
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--trail-amber-text);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.15;
    margin: 0 0 14px;
    color: var(--lake-deep);
  }

  .page-hero p.lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 auto;
    max-width: 520px;
  }

  /* ---------- Empty state ---------- */

  .empty-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 70px 24px 90px;
    text-align: center;
  }

  .empty-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--paper-warm);
    border: 1px solid var(--nav-border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
  }

  .empty-icon svg {
    width: 32px;
    height: 32px;
    stroke: var(--lake-mist);
  }

  .empty-wrap h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 23px;
    color: var(--lake-deep);
    margin: 0 0 12px;
  }

  .empty-wrap p {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto;
  }

  footer {
    text-align: center;
    padding: 22px 20px 26px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 1px solid rgba(90,70,50,0.15);
  }

  footer strong { color: var(--ink); }
</style>
</head>
<body>

  <!-- Shared banner + header + mobile nav get injected here by partials.js -->
  <div id="site-chrome"></div>

  <section class="page-hero">
    <div class="page-hero-inner">
      <div class="eyebrow">For Visitors</div>
      <h1>Events</h1>
      <p class="lede">
        Festivals, fairs, markets, and everything else happening around the
        state.
      </p>
    </div>
  </section>

  <main class="empty-wrap">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </div>
    <h2>Nothing scheduled right now</h2>
    <p>There are no upcoming events to show at the moment. Check back later.</p>
  </main>

  <footer>
    <strong>Department of Technology</strong> · migovt.org · Events
  </footer>

  <!-- Injects banner + header + mobile nav into #site-chrome above -->
  <script src="/partials.js"></script>

</body>
</html>
